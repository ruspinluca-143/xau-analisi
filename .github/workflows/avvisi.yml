name: Avvisi

# Ogni 5 minuti controlla se c'è un segnale favorevole e manda la notifica sul telefono (ntfy).
# GitHub può ritardare i controlli di qualche minuto: non è istantaneo.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: avvisi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ripristina i segnali già notificati
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-
      - name: Controlla e notifica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
